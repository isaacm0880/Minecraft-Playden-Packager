[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-playden"
dynamic = ["version"]
description = "Package local Minecraft Java instances for Playden with a desktop GUI and offline CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
minecraft-playden = "minecraft_playden.cli:main"
minecraft-playden-gui = "minecraft_playden.gui:main"

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8"]
# 6.12.0 Signal.emit corrupts bool reference counts on Python 3.11 (PYSIDE-3474).
gui = ["PySide6>=6.8,<7,!=6.12.0", "cryptography>=50.0.2"]

[project.urls]
Repository = "https://github.com/isaacm0880/Minecraft-Playden-Packager"
Issues = "https://github.com/isaacm0880/Minecraft-Playden-Packager/issues"

[tool.setuptools.dynamic]
version = {attr = "minecraft_playden.__version__"}

[tool.setuptools.packages.find]
include = ["minecraft_playden*"]

[tool.setuptools.package-data]
minecraft_playden = ["resources/icons/*.png", "resources/icons/*.ico", "resources/icons/*.icns", "resources/icons/*.json", "resources/remap/*.java", "resources/java8/*.java", "resources/java8/*.class"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
