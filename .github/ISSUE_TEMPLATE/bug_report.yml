name: Bug report
description: Report an application, packaging or USB-copy problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not attach credentials, account files, game clients, worlds or populated packages. Review logs for personal paths."
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "v0.1.0 or source commit"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options:
        - Windows x64
        - Linux x86_64
        - macOS Apple Silicon
        - macOS Intel
        - Other/source environment
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS version and installation method
      placeholder: "Include source Python/Qt versions if applicable."
  - type: input
    id: minecraft
    attributes:
      label: Launcher, Minecraft version, loader and loader version
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: "For queues, include selected/succeeded/copied counts. For USB, include filesystem, verification/cleanup choices and per-item results."
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error or reviewed log excerpt
      render: text
