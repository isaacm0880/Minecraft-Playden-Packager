name: PS5 receiver host integration
on:
  push:
    branches: [feat/ps5-network-transfer]
  pull_request:
    paths:
      - 'ps5/receiver/**'
      - 'ps5/diagnostic/recipe_check.h'
      - 'minecraft_playden/network*.py'
      - 'tests/test_network*.py'
      - 'tests/test_lan_benchmark.py'
      - 'tests/lan_fixtures.py'
      - 'tools/lan_benchmark.py'
      - '.github/workflows/ps5-receiver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitized-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Exercise real receiver sources with address and undefined-behavior sanitizers
        run: python -m pytest -q tests/test_network_receiver.py tests/test_network_transfer.py tests/test_lan_benchmark.py
        env:
          PLAYDEN_RECEIVER_SANITIZE: '1'
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
