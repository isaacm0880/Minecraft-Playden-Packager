name: Desktop release candidate (no publishing)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character public commit SHA on the workflow ref selected for this run'
        required: true
        type: string
      build_macos:
        description: 'Optional experimental macOS builds; not required for v0.1.0'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: desktop-release-candidate
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          CANDIDATE_EVENT: ${{ github.event_name }}
          CANDIDATE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from release.provenance import candidate_source, check_source
          requested = candidate_source(os.environ['CANDIDATE_EVENT'], os.environ['CANDIDATE_REF'],
                                       os.environ['WORKFLOW_SHA'], os.environ['REQUESTED_SHA'])
          print('Candidate source:', requested, 'event:', os.environ['CANDIDATE_EVENT'])
          check_source(Path.cwd(), requested)
          from release.public_audit import audit_source
          audit_source(Path.cwd())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + requested + '\n')
          PY
  windows:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: python -m pip install -r release/requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Windows path aliases and GUI worker completion regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from pathlib import Path; import tempfile; p=Path(tempfile.gettempdir()); print('Temporary path:', p); print('Resolved path:', p.resolve())"
          python -m pytest -vv --tb=long tests/test_gui.py::GuiTests::test_queue_summary_and_open_folder_use_common_parent_for_partial_results tests/test_gui.py::GuiTests::test_usb_transfer_worker_reports_bytes_and_can_retry_after_failure tests/test_gui.py::GuiTests::test_transfer_result_alias_mismatch_finishes_and_retry_accepts_canonical_source tests/test_gui.py::GuiTests::test_open_shared_queue_parent_resolves_path_aliases tests/test_transfer.py::TransferTests::test_fast_copy_skips_destination_checksum_pass_but_keeps_validation tests/test_cleanup.py
      - run: python -m release.build_desktop --source-sha "${{ needs.source.outputs.sha }}" --output dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-${{ needs.source.outputs.sha }}
          if-no-files-found: error
          path: |
            dist/windows/*.zip
            dist/windows/SHA256SUMS
            dist/windows/artifact.json
            dist/windows/build-metadata.json
            dist/windows/content-audit.json
  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: python:3.11.14-slim-bookworm@sha256:65a93d69fa75478d554f4ad27c85c1e69fa184956261b4301ebaf6dbb0a3543d
    steps:
      - name: Install Git before checkout (retain exact commit history)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only the checked-out container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: sh release/linux-system-deps.sh
      - run: python -m pip install -r release/requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m release.build_desktop --source-sha "${{ needs.source.outputs.sha }}" --output dist/linux
      - name: Packaged X11 startup in a clean Linux container
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb dist/linux/frozen/MinecraftPlaydenPackager/MinecraftPlaydenPackager --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-x86_64-${{ needs.source.outputs.sha }}
          if-no-files-found: error
          path: |
            dist/linux/*.AppImage
            dist/linux/SHA256SUMS
            dist/linux/artifact.json
            dist/linux/build-metadata.json
            dist/linux/content-audit.json
  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.build_macos
    continue-on-error: true
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python_architecture: arm64
            label: macOS-ARM64
          - runner: macos-15-intel
            architecture: x86_64
            python_architecture: x64
            label: macOS-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: ${{ matrix.python_architecture }}
      - run: python -m pip install -r release/requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m release.build_desktop --source-sha "${{ needs.source.outputs.sha }}" --architecture "${{ matrix.architecture }}" --output dist/macos
      - name: Native Cocoa packaged GUI smoke
        run: python -m release.smoke "dist/macos/frozen/Minecraft Playden Packager.app/Contents/MacOS/MinecraftPlaydenPackager" --native-cocoa
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ needs.source.outputs.sha }}
          if-no-files-found: error
          path: |
            dist/macos/*.zip
            dist/macos/SHA256SUMS
            dist/macos/artifact.json
            dist/macos/build-metadata.json
            dist/macos/content-audit.json
  verify-pair:
    needs: [source, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64-${{ needs.source.outputs.sha }}
          path: dist/pair/windows
      - uses: actions/download-artifact@v4
        with:
          name: Linux-x86_64-${{ needs.source.outputs.sha }}
          path: dist/pair/linux
      - run: python -m release.verify_pair --windows dist/pair/windows --linux dist/pair/linux --source-sha "${{ needs.source.outputs.sha }}" --output release-pair.json
      - uses: actions/upload-artifact@v4
        with:
          name: Verified-source-pair-${{ needs.source.outputs.sha }}
          path: |
            release-pair.json
            SHA256SUMS
          if-no-files-found: error
