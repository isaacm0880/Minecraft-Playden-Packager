name: Tests
on:
  push:
    branches: [main, release/v0.1.0-prep]
  pull_request:
  workflow_dispatch:
    inputs:
      test_macos:
        description: 'Optional experimental macOS source tests; not a v0.1.0 binary gate'
        required: false
        default: false
        type: boolean
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries for offscreen tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 fonts-dejavu-core
      - run: python -m pip install ".[dev,gui]"
      - name: Repeat USB GUI completion and validation regressions
        shell: bash
        run: |
          for attempt in {1..10}; do
            python -m pytest -q --durations=3 \
              tests/test_gui_release.py::ReleaseGuiTests::test_skipped_checksum_queue_keeps_all_local_outputs_and_mandatory_validation \
              tests/test_gui_release.py::ReleaseGuiTests::test_skipped_checksum_queue_rejects_corrupt_copy_and_keeps_local_outputs \
              tests/test_gui.py::GuiTests::test_transfer_result_alias_mismatch_finishes_and_retry_accepts_canonical_source \
              || exit 1
          done
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m release.public_audit
      - run: python -m pytest -v -o faulthandler_timeout=90
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m mypy --platform linux minecraft_playden release
      - run: python -m mypy --platform win32 minecraft_playden release
      - run: python -m mypy --platform darwin minecraft_playden release
  macos-source:
    if: github.event_name == 'workflow_dispatch' && inputs.test_macos
    continue-on-error: true
    timeout-minutes: 15
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,gui]"
      - run: python -m release.public_audit
      - run: python -m pytest -v -o faulthandler_timeout=90
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m mypy --platform darwin minecraft_playden release
