name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 fonts-dejavu-core
      - run: python -m pip install ".[dev,gui]"
      - name: Reproduce baseline GUI deadline with slow storage
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PYTHON'
          import sys, time, unittest
          from unittest.mock import patch
          sys.stdout.reconfigure(errors="backslashreplace")
          sys.path.insert(0, 'tests')
          from test_gui_release import ReleaseGuiTests
          from minecraft_playden.transfer import flush_file
          calls = []
          def slow_flush(fd):
              calls.append(time.monotonic())
              time.sleep(.065)
              flush_file(fd)
          with patch('minecraft_playden.transfer.flush_file', side_effect=slow_flush):
              result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([
                  ReleaseGuiTests('test_skipped_checksum_queue_keeps_all_local_outputs_and_mandatory_validation')]))
          print('Flush calls:', len(calls), 'elapsed:', calls[-1] - calls[0])
          assert len(result.failures) == 1, 'Expected exactly the baseline GUI deadline failure'
          assert not result.errors, result.errors
          assert 'GUI worker did not finish' in result.failures[0][1]
          print('Reproduced baseline GUI timeout; teardown cancelled the active worker successfully.')
          PYTHON
